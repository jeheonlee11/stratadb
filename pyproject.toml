[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratadb"
version = "0.1.0"
description = "Embedded, graph-native vector database: HNSW segments, a write-ahead log, metadata filters and typed edges"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeheon Lee" }]
dependencies = ["numpy>=1.24"]
keywords = ["vector database", "hnsw", "graph", "rag", "embeddings"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stratadb = "stratadb.__main__:main"

[tool.setuptools.packages.find]
include = ["stratadb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
